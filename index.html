<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>나락도 락이다 — 공연 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #EAF6F3;
    color: #2B4C4A;
    font-family: 'Nunito', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: none;
  }
  body {
    background:
      radial-gradient(circle at 8% 0%, rgba(143,199,242,0.35), transparent 42%),
      radial-gradient(circle at 95% 15%, rgba(255,177,153,0.30), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(127,216,208,0.30), transparent 50%),
      #EAF6F3;
    background-attachment: fixed;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 96px; }

  /* ---------- Header ---------- */
  header {
    padding: 22px 20px 16px;
    position: sticky; top: 0; z-index: 30;
    background: rgba(234,246,243,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(43,76,74,0.08);
  }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .brand h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.2px;
    color: #2B4C4A;
    white-space: nowrap;
  }
  .brand h1 span { color: #FF9E80; }
  .brand .count {
    font-size: 11px;
    flex-shrink: 0;
    font-weight: 700;
    color: rgba(43,76,74,0.45);
    letter-spacing: 0.3px;
  }
  .tabs { display: flex; gap: 8px; margin-top: 16px; }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2px;
    border: 1.5px solid rgba(43,76,74,0.15);
    border-radius: 14px;
    color: rgba(43,76,74,0.5);
    cursor: pointer;
    transition: all 0.15s;
    background: rgba(255,255,255,0.4);
  }
  .tab.active {
    background: linear-gradient(135deg, #8FC7F2, #7FD8D0);
    border-color: transparent;
    color: #1B3B39;
    box-shadow: 0 4px 14px rgba(127,216,208,0.45);
  }

  /* ---------- Calendar ---------- */
  .cal-wrap { padding: 18px 20px 8px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav button {
    background: rgba(255,255,255,0.6);
    border: 1.5px solid rgba(43,76,74,0.12);
    color: #2B4C4A;
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 17px;
    cursor: pointer;
  }
  .cal-nav h2 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 19px;
    font-weight: 600;
    color: #2B4C4A;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: rgba(43,76,74,0.4); padding-bottom: 6px; }
  .cal-cell {
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(43,76,74,0.55);
    position: relative;
    cursor: default;
    background: rgba(255,255,255,0.35);
  }
  .cal-cell.empty { visibility: hidden; background: transparent; }
  .cal-cell.has-event {
    color: #1B3B39;
    cursor: pointer;
    background: linear-gradient(150deg, rgba(143,199,242,0.35), rgba(127,216,208,0.35));
    border: 1.5px solid rgba(127,216,208,0.6);
  }
  .cal-cell.today { box-shadow: inset 0 0 0 2px #FF9E80; }
  .cal-dot { width: 6px; height: 6px; border-radius: 50%; background: #FF9E80; margin-top: 3px; }
  .cal-cell.selected { background: linear-gradient(135deg, #8FC7F2, #7FD8D0); color: #1B3B39; font-weight: 800; border-color: transparent; }
  .cal-cell.selected .cal-dot { background: #1B3B39; }

  .day-events { padding: 4px 20px 10px; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Year stats (모아보기) ---------- */
  .year-stats { padding: 6px 20px 20px; }
  .year-stats-card {
    background: linear-gradient(150deg, rgba(143,199,242,0.16), rgba(127,216,208,0.16));
    border: 1.5px solid rgba(127,216,208,0.35);
    border-radius: 18px;
    padding: 16px 16px 8px;
  }
  .year-stats-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 14px; font-weight: 600;
    color: #1B3B39;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .year-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .ys-item {
    background: rgba(255,255,255,0.55);
    border-radius: 12px;
    padding: 12px 12px 10px;
  }
  .ys-item.wide { grid-column: 1 / -1; }
  .ys-label {
    font-size: 10px; font-weight: 800; letter-spacing: 0.2px;
    color: rgba(43,76,74,0.5);
    margin-bottom: 4px;
  }
  .ys-value {
    font-family: 'Baloo 2', sans-serif;
    font-size: 19px; font-weight: 700;
    color: #2B8A7E;
    line-height: 1.2;
  }
  .ys-value small { font-size: 12px; font-weight: 700; color: rgba(43,76,74,0.55); }
  .ys-value.coral { color: #E8734A; }
  .ys-sub { font-size: 11px; font-weight: 600; color: rgba(43,76,74,0.5); margin-top: 2px; }
  .year-stats-empty {
    text-align: center;
    padding: 18px 10px;
    font-size: 12px; font-weight: 600;
    color: rgba(43,76,74,0.45);
  }

  .year-toggle {
    display: flex; gap: 4px;
    background: rgba(255,255,255,0.5);
    border-radius: 10px;
    padding: 3px;
  }
  .year-toggle button {
    border: none; background: transparent;
    padding: 4px 10px;
    font-size: 10px; font-weight: 800;
    color: rgba(43,76,74,0.5);
    border-radius: 7px;
    cursor: pointer;
  }
  .year-toggle button.active {
    background: #2B8A7E;
    color: #fff;
  }

  .stats-block { margin-top: 14px; }
  .stats-block-title {
    font-size: 10px; font-weight: 800; letter-spacing: 0.2px;
    color: rgba(43,76,74,0.55);
    margin-bottom: 8px;
  }

  .top-artist-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px;
  }
  .top-artist-rank {
    width: 20px; text-align: center;
    font-family: 'Baloo 2', sans-serif;
    font-size: 13px; font-weight: 700;
    color: #2B8A7E;
    flex-shrink: 0;
  }
  .top-artist-name { flex: 1; font-size: 13px; font-weight: 700; color: #1B3B39; }
  .top-artist-bar-wrap { flex: 1; background: rgba(43,76,74,0.08); border-radius: 6px; height: 8px; overflow: hidden; }
  .top-artist-bar { height: 100%; background: linear-gradient(90deg, #8FC7F2, #7FD8D0); border-radius: 6px; }
  .top-artist-count { font-size: 11px; font-weight: 800; color: rgba(43,76,74,0.55); flex-shrink: 0; width: 34px; text-align: right; }

  .cat-table { width: 100%; border-collapse: collapse; }
  .cat-table td { padding: 7px 4px; font-size: 12px; font-weight: 700; color: #2B4C4A; border-bottom: 1px solid rgba(43,76,74,0.08); }
  .cat-table tr:last-child td { border-bottom: none; }
  .cat-table td:last-child { text-align: right; color: #2B8A7E; }

  .month-chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding-top: 6px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .month-bar { width: 100%; background: linear-gradient(180deg, #8FC7F2, #7FD8D0); border-radius: 4px 4px 2px 2px; min-height: 2px; }
  .month-label { font-size: 8px; font-weight: 800; color: rgba(43,76,74,0.45); }
  .month-count { font-size: 9px; font-weight: 800; color: #2B8A7E; }

  .venue-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 4px;
    border-bottom: 1px solid rgba(43,76,74,0.08);
  }
  .venue-row:last-child { border-bottom: none; }
  .venue-name { font-size: 12px; font-weight: 700; color: #1B3B39; }
  .venue-sub { font-size: 10px; font-weight: 600; color: rgba(43,76,74,0.45); margin-top: 1px; }
  .venue-spend { font-size: 12px; font-weight: 800; color: #E8734A; text-align: right; }
  /* ---------- List ---------- */
  .list-wrap { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; }
  .list-summary {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px;
    background: rgba(255,255,255,0.5);
    border: 1.5px dashed rgba(43,76,74,0.2);
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    color: rgba(43,76,74,0.7);
  }
  .list-summary b { color: #2B8A7E; font-size: 17px; font-family: 'Baloo 2', sans-serif; }

  /* ---------- Ticket Stub Card ---------- */
  .stub {
    background: #FFFDF8;
    color: #2B4C4A;
    border-radius: 16px;
    display: flex;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(43,76,74,0.14);
  }
  .stub-main { flex: 1; padding: 16px 14px 16px 18px; position: relative; }
  .stub-cat {
    display: inline-block;
    font-size: 10px; letter-spacing: 0.3px;
    color: #2B8A7E; font-weight: 800; margin-bottom: 5px;
    background: rgba(127,216,208,0.18);
    padding: 3px 9px;
    border-radius: 8px;
  }
  .stub-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 19px; font-weight: 700;
    letter-spacing: 0.2px;
    line-height: 1.2;
    margin-bottom: 8px;
    word-break: keep-all;
    color: #1B3B39;
  }
  .stub-meta { font-size: 12px; font-weight: 600; color: rgba(43,76,74,0.6); display: flex; flex-direction: column; gap: 4px; }
  .stub-meta .row { display: flex; gap: 6px; align-items: center; }
  .stub-photo {
    width: 100%; height: 110px; object-fit: cover; border-radius: 10px; margin-top: 10px;
    border: 1px solid rgba(43,76,74,0.08);
  }
  .stub-stub { /* right torn section */
    width: 78px;
    border-left: 2px dashed rgba(43,76,74,0.2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 6px;
    position: relative;
    background: repeating-linear-gradient(135deg, rgba(143,199,242,0.12) 0 8px, transparent 8px 16px);
  }
  .stub-stub::before, .stub-stub::after {
    content: ''; position: absolute; width: 16px; height: 16px; background: #EAF6F3; border-radius: 50%;
    left: -9px;
  }
  .stub-stub::before { top: -8px; }
  .stub-stub::after { bottom: -8px; }
  .stub-price {
    writing-mode: vertical-rl;
    font-family: 'Baloo 2', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
    color: #4A7FBF;
    margin-bottom: 8px;
  }
  .stub-barcode {
    display: flex; gap: 1.5px; height: 34px; align-items: flex-end;
  }
  .stub-barcode div { width: 2px; background: rgba(43,76,74,0.35); border-radius: 1px; }
  .stub-num { font-size: 8px; font-weight: 700; letter-spacing: 0.5px; color: rgba(43,76,74,0.35); margin-top: 4px; }
  .stub-actions {
    display: flex; gap: 8px; margin-top: 4px;
  }
  .stub-actions button {
    flex: 1;
    padding: 9px 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
  }
  .btn-share { background: linear-gradient(135deg, #8FC7F2, #7FD8D0); color: #1B3B39; }
  .btn-edit { background: rgba(43,76,74,0.08); color: #2B4C4A; }
  .btn-del { background: rgba(255,158,128,0.18); color: #E8734A; }
  .card-shell { display: flex; flex-direction: column; gap: 8px; }

  .empty-state {
    text-align: center;
    padding: 60px 30px;
    color: rgba(43,76,74,0.45);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.7;
  }
  .empty-state .big { font-size: 36px; margin-bottom: 10px; }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    max-width: 480px; width: calc(100% - 40px);
    z-index: 40;
  }
  .fab button {
    width: 100%;
    background: linear-gradient(135deg, #8FC7F2, #7FD8D0);
    color: #1B3B39;
    border: none;
    padding: 16px 0;
    border-radius: 30px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    box-shadow: 0 10px 26px rgba(127,216,208,0.5);
    cursor: pointer;
  }

  /* ---------- Modal ---------- */
  .modal-bg {
    display: none;
    position: fixed; inset: 0;
    background: rgba(27,59,57,0.45);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #FFFDF8;
    color: #2B4C4A;
    width: 100%; max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 24px 24px 0 0;
    padding: 22px 20px 30px;
  }
  .modal h3 {
    font-family: 'Baloo 2', sans-serif;
    letter-spacing: 0.2px;
    margin-bottom: 18px;
    font-size: 18px;
    color: #1B3B39;
  }
  .field { margin-bottom: 14px; }

  /* ---------- Event backlog autocomplete ---------- */
  .suggest-dropdown {
    display: none;
    position: absolute;
    top: 100%; left: 0; right: 0;
    margin-top: 4px;
    background: #FFFDF8;
    border: 1.5px solid rgba(43,76,74,0.15);
    border-radius: 14px;
    box-shadow: 0 12px 28px rgba(43,76,74,0.18);
    max-height: 220px;
    overflow-y: auto;
    z-index: 20;
  }
  .suggest-dropdown.show { display: block; }
  .suggest-item {
    padding: 11px 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(43,76,74,0.06);
  }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:active, .suggest-item:hover { background: rgba(127,216,208,0.12); }
  .suggest-item .s-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 13px; font-weight: 600; color: #1B3B39;
  }
  .suggest-item .s-meta {
    font-size: 11px; font-weight: 600; color: rgba(43,76,74,0.5);
    margin-top: 2px;
  }
  .suggest-hint {
    padding: 9px 14px;
    font-size: 10px; font-weight: 700;
    color: rgba(43,76,74,0.4);
    background: rgba(127,216,208,0.08);
  }

  .field label {
    display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.2px;
    color: rgba(43,76,74,0.55);
    margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: rgba(43,76,74,0.05);
    border: 1.5px solid rgba(43,76,74,0.15);
    color: #2B4C4A;
    padding: 12px;
    border-radius: 12px;
    font-family: 'Nunito', sans-serif;
    font-weight: 600;
    font-size: 14px;
  }
  .field input[type="file"] {
    padding: 10px;
    font-size: 12px;
    color: rgba(43,76,74,0.6);
  }
  .field input[type="file"]::file-selector-button {
    background: linear-gradient(135deg, #8FC7F2, #7FD8D0);
    color: #1B3B39;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.2px;
    margin-right: 10px;
    cursor: pointer;
  }
  .field textarea { resize: vertical; min-height: 50px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .cat-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .cat-chip {
    padding: 8px 13px;
    border-radius: 16px;
    border: 1.5px solid rgba(43,76,74,0.15);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: rgba(43,76,74,0.55);
  }
  .cat-chip.sel { background: linear-gradient(135deg, #8FC7F2, #7FD8D0); border-color: transparent; color: #1B3B39; }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal-actions button {
    flex: 1; padding: 15px 0; border-radius: 14px; border: none;
    font-family: 'Baloo 2', sans-serif; font-weight: 600; letter-spacing: 0.2px;
    font-size: 14px; cursor: pointer;
  }
  .btn-cancel { background: rgba(43,76,74,0.07); color: #2B4C4A; }
  .btn-save { background: linear-gradient(135deg, #8FC7F2, #7FD8D0); color: #1B3B39; }
  .hint { font-size: 11px; font-weight: 600; color: rgba(43,76,74,0.4); margin-top: -8px; margin-bottom: 14px; line-height: 1.5; }

  .toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: #2B4C4A; color: #EAF6F3; padding: 11px 20px; border-radius: 20px;
    font-size: 12px; font-weight: 700; z-index: 60; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .loading-screen {
    position: fixed; inset: 0; background: #EAF6F3; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', sans-serif; letter-spacing: 0.5px; color: rgba(43,76,74,0.4);
    font-size: 13px; font-weight: 600;
  }
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">LOADING…</div>
<div id="app" style="display:none;">

  <header>
    <div class="brand">
      <h1>나락도 <span>락</span>이다</h1>
      <div class="count" id="headerCount">0개의 기록</div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="calendar">캘린더</div>
      <div class="tab" data-tab="list">전체 기록</div>
    </div>
  </header>

  <div id="calendarView">
    <div class="cal-wrap">
      <div class="cal-nav">
        <button id="prevMonth">‹</button>
        <h2 id="calTitle">2026. 07</h2>
        <button id="nextMonth">›</button>
      </div>
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="day-events" id="dayEvents"></div>

    <div class="year-stats" id="yearStats"></div>
  </div>

  <div id="listView" style="display:none;">
    <div class="list-wrap" id="listWrap"></div>
  </div>

</div>

<div class="fab"><button id="openAdd">+ 기록 추가</button></div>

<!-- Add/Edit Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">새 기록</h3>
    <input type="hidden" id="editId">

    <div class="field">
      <label>카테고리</label>
      <div class="cat-picker" id="catPicker">
        <div class="cat-chip" data-cat="콘서트">콘서트</div>
        <div class="cat-chip" data-cat="페스티벌">페스티벌</div>
        <div class="cat-chip" data-cat="공연">공연</div>
        <div class="cat-chip" data-cat="뮤지컬">뮤지컬</div>
        <div class="cat-chip" data-cat="기타">기타</div>
      </div>
    </div>

    <div class="field" style="position:relative;">
      <label>아티스트</label>
      <input type="text" id="fArtist" placeholder="예) 아이유, 세븐틴 (여러 명이면 콤마로 구분)" autocomplete="off">
      <div id="artistSuggest" class="suggest-dropdown"></div>
    </div>

    <div class="field">
      <label>공연명</label>
      <input type="text" id="fEventName" placeholder="예) IU CONCERT : HEREH WORLD TOUR" autocomplete="off">
    </div>

    <div class="field-row">
      <div class="field">
        <label>날짜</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>티켓값 (원)</label>
        <input type="number" id="fPrice" placeholder="0" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <label>장소</label>
      <input type="text" id="fVenue" placeholder="예) 고척스카이돔">
    </div>

    <div class="field">
      <label>현장 사진 (선택)</label>
      <input type="file" id="fPhotoFile" accept="image/*">
      <div id="photoPreviewWrap" style="display:none; margin-top:10px; position:relative;">
        <img id="photoPreview" style="width:100%; border-radius:8px; max-height:180px; object-fit:cover;">
        <button type="button" id="removePhoto" style="position:absolute; top:6px; right:6px; background:rgba(26,26,26,0.75); color:#F5F0E8; border:none; width:26px; height:26px; border-radius:50%; font-size:13px; cursor:pointer;">✕</button>
      </div>
      <div id="photoStatus" class="hint" style="margin-bottom:0;"></div>
    </div>

    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="fMemo" placeholder="셋리스트, 좌석, 느낀 점 등"></textarea>
    </div>

    <div id="saveError" style="font-size:11px; font-weight:700; color:#E8734A; margin-bottom:8px; word-break:break-all; line-height:1.5;"></div>

    <div class="modal-actions">
      <button class="btn-cancel" id="cancelBtn">취소</button>
      <button class="btn-save" id="saveBtn">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  // ---------- Storage adapter ----------
  // window.storage (shared, cross-device) only exists inside Claude.ai's artifact
  // preview. When this file is hosted elsewhere (Vercel, downloaded + opened, etc.)
  // that API doesn't exist, and every save would silently/loudly fail. Fall back to
  // localStorage in that case so saving always works — just per-device instead of shared.
  const hasNativeStorage = typeof window.storage === 'object' && window.storage !== null
    && typeof window.storage.get === 'function' && typeof window.storage.set === 'function';

  const LOCAL_NS = 'stubs_local_v1:';
  const localBackend = {
    isNative: false,
    async get(key){
      try {
        const raw = localStorage.getItem(LOCAL_NS + key);
        if (raw === null) return null;
        return { key, value: raw, shared: false };
      } catch(e){ console.error('localStorage get failed:', e); return null; }
    },
    async set(key, value){
      try {
        localStorage.setItem(LOCAL_NS + key, value);
        return { key, value, shared: false };
      } catch(e){ console.error('localStorage set failed:', e); return null; }
    },
    async delete(key){
      try {
        localStorage.removeItem(LOCAL_NS + key);
        return { key, deleted: true, shared: false };
      } catch(e){ console.error('localStorage delete failed:', e); return null; }
    }
  };

  const nativeBackend = hasNativeStorage ? {
    isNative: true,
    async get(key, shared){ return window.storage.get(key, shared !== false); },
    async set(key, value, shared){ return window.storage.set(key, value, shared !== false); },
    async delete(key, shared){ return window.storage.delete(key, shared !== false); }
  } : null;

  const Store = hasNativeStorage ? nativeBackend : localBackend;
  window.__storageIsLocalFallback = !hasNativeStorage;

  const STORAGE_KEY_PREFIX = 'stub_entry:';
  const LIST_KEY = 'stub_entry_ids';

  let entries = [];
  let currentTab = 'calendar';
  let calYear, calMonth; // 0-indexed month
  let selectedDate = null;
  let editingId = null;
  let currentPhotoData = ''; // base64 data URL currently attached to the form
  let statsScope = 'year'; // 'year' | 'all'

  const $ = (id) => document.getElementById(id);

  function toast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function uid(){ return 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  // ---------- Photo handling (resize + compress to keep under storage limits) ----------
  function resizeImageFile(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let { width, height } = img;
          if (width > height && width > maxDim){
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else if (height > maxDim){
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Keeps shrinking dimension/quality until the result fits under maxChars (base64 length),
  // so even very large original photos always end up small enough to store.
  async function compressImageToLimit(file, maxChars){
    const steps = [
      { dim: 1280, q: 0.8 },
      { dim: 1100, q: 0.7 },
      { dim: 900,  q: 0.65 },
      { dim: 750,  q: 0.6 },
      { dim: 600,  q: 0.5 },
      { dim: 480,  q: 0.45 },
      { dim: 360,  q: 0.4 }
    ];
    let result = null;
    for (const step of steps){
      result = await resizeImageFile(file, step.dim, step.q);
      if (result.length <= maxChars) return result;
    }
    return result; // smallest attempted, best effort
  }

  // ---------- Storage (shared) ----------
  async function loadEntries(){
    try {
      const idxRes = await Store.get(LIST_KEY, true);
      const ids = idxRes ? JSON.parse(idxRes.value) : [];
      const loaded = [];
      for (const id of ids){
        try {
          const r = await Store.get(STORAGE_KEY_PREFIX + id, true);
          if (r) loaded.push(JSON.parse(r.value));
        } catch(e){ /* missing key, skip */ }
      }
      entries = loaded.sort((a,b)=> new Date(b.date) - new Date(a.date));
    } catch(e){
      entries = [];
    }
  }

  async function saveIndex(extraId){
    const ids = entries.map(e=>e.id);
    if (extraId && !ids.includes(extraId)) ids.push(extraId);
    const result = await Store.set(LIST_KEY, JSON.stringify(ids), true);
    if (!result) throw new Error('목록 저장 실패 (storage.set이 빈 값을 반환함)');
  }

  async function saveEntry(entry){
    const result = await Store.set(STORAGE_KEY_PREFIX + entry.id, JSON.stringify(entry), true);
    if (!result) throw new Error('기록 저장 실패 (storage.set이 빈 값을 반환함, 사진 용량이 원인일 수 있어요)');
  }

  async function deleteEntryStorage(id){
    try { await Store.delete(STORAGE_KEY_PREFIX + id, true); } catch(e){}
  }

  // ---------- Rendering ----------
  function fmtMoney(n){
    if (!n) return '0원';
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  // A single entry can list multiple artists separated by commas
  // (e.g. "아이유, 세븐틴" for a joint show) — split them out so stats
  // count each artist individually rather than as one combined string.
  function splitArtists(artistStr){
    if (!artistStr) return [];
    return artistStr.split(',').map(a=>a.trim()).filter(Boolean);
  }
  function fmtDateShort(d){
    const dt = new Date(d + 'T00:00:00');
    return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
  }
  function fmtDateLong(d){
    const dt = new Date(d + 'T00:00:00');
    const days = ['일','월','화','수','목','금','토'];
    return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 (${days[dt.getDay()]})`;
  }

  function barcodeBars(seed){
    // deterministic pseudo-barcode from seed string
    let bars = [];
    let s = 0;
    for (let i=0;i<seed.length;i++) s += seed.charCodeAt(i);
    for (let i=0;i<26;i++){
      const h = 10 + ((s * (i+3)) % 24);
      bars.push(h);
    }
    return bars;
  }

  function ticketNumber(id){
    let s = 0;
    for (let i=0;i<id.length;i++) s += id.charCodeAt(i) * (i+1);
    return 'NO. ' + String(s % 999999).padStart(6,'0');
  }

  // ---------- Share image (drawn directly on <canvas>, not via html2canvas) ----------
  // html2canvas doesn't support object-fit or writing-mode, which broke photo cropping
  // and made the vertical price text overlap. Drawing manually avoids both problems
  // and guarantees a correct, predictable aspect ratio every time.
  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawCover(ctx, img, dx, dy, dW, dH){
    const ir = img.width / img.height;
    const tr = dW / dH;
    let sx, sy, sw, sh;
    if (ir > tr){
      sh = img.height;
      sw = sh * tr;
      sx = (img.width - sw) / 2;
      sy = 0;
    } else {
      sw = img.width;
      sh = sw / tr;
      sx = 0;
      sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dW, dH);
  }

  function wrapCanvasText(ctx, text, maxWidth, maxLines){
    const chars = Array.from(text || '');
    const lines = [];
    let current = '';
    for (const ch of chars){
      const test = current + ch;
      if (ctx.measureText(test).width > maxWidth && current.length > 0){
        lines.push(current);
        current = ch;
        if (lines.length >= maxLines) { current = ''; break; }
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
    if (!lines.length) return [''];
    if (lines.length > maxLines) lines.length = maxLines;
    const joinedLen = lines.join('').length;
    if (joinedLen < chars.length){
      let last = lines[lines.length-1];
      while (ctx.measureText(last + '…').width > maxWidth && last.length > 0){
        last = last.slice(0, -1);
      }
      lines[lines.length-1] = last + '…';
    }
    return lines;
  }

  function truncateCanvasText(ctx, text, maxWidth){
    if (ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while (t.length > 0 && ctx.measureText(t + '…').width > maxWidth){
      t = t.slice(0, -1);
    }
    return t + '…';
  }

  async function buildStubCanvas(entry){
    const SCALE = 2;
    const W = 420 * SCALE;
    const outerPad = 24 * SCALE;
    const cardX = outerPad;
    const cardW = W - outerPad*2;
    const padX = 18 * SCALE;
    const padTop = 18 * SCALE;
    const padBottom = 18 * SCALE;
    const radius = 16 * SCALE;
    const contentW = cardW - padX*2;

    try {
      await Promise.all([
        document.fonts.load(`700 ${19*SCALE}px "Baloo 2"`),
        document.fonts.load(`600 ${14*SCALE}px "Baloo 2"`),
        document.fonts.load(`700 ${20*SCALE}px "Baloo 2"`),
        document.fonts.load(`800 ${10*SCALE}px "Nunito"`),
        document.fonts.load(`600 ${12*SCALE}px "Nunito"`),
        document.fonts.load(`700 ${8*SCALE}px "Nunito"`)
      ]);
    } catch(e){ /* fonts may already be loaded; proceed regardless */ }

    let img = null;
    if (entry.photo){
      img = await new Promise((resolve)=>{
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => resolve(null);
        im.src = entry.photo;
      });
    }

    const measure = document.createElement('canvas').getContext('2d');

    const catFont   = `800 ${10*SCALE}px "Nunito", sans-serif`;
    const titleFont = `700 ${19*SCALE}px "Baloo 2", sans-serif`;
    const metaFont  = `600 ${12*SCALE}px "Nunito", sans-serif`;
    const memoFont  = `600 ${11*SCALE}px "Nunito", sans-serif`;
    const priceFont = `700 ${20*SCALE}px "Baloo 2", sans-serif`;
    const numFont   = `700 ${8*SCALE}px "Nunito", sans-serif`;

    const mainTitle = entry.eventName || entry.artist;
    measure.font = titleFont;
    const titleLines = wrapCanvasText(measure, mainTitle, contentW, 2);

    const showArtistRow = !!(entry.eventName && entry.artist && entry.artist !== entry.eventName);
    const metaRows = [];
    if (showArtistRow) metaRows.push(`🎤 ${entry.artist}`);
    metaRows.push(`📅 ${fmtDateLong(entry.date)}`);
    if (entry.venue) metaRows.push(`📍 ${entry.venue}`);

    measure.font = memoFont;
    let memoLines = [];
    if (entry.memo){
      memoLines = wrapCanvasText(measure, entry.memo, contentW, 2);
    }

    // ---- layout pass ----
    const catBadgeH = 22 * SCALE;
    const catMarginBottom = 8 * SCALE;
    const titleLineH = 24 * SCALE;
    const titleMarginBottom = 10 * SCALE;
    const metaRowH = 20 * SCALE;
    const metaGap = 4 * SCALE;
    const memoMarginTop = 6 * SCALE;
    const memoLineH = 15 * SCALE;
    const photoH = img ? 110 * SCALE : 0;
    const photoMarginTop = img ? 12 * SCALE : 0;
    const dividerMarginTop = 16 * SCALE;
    const footerMarginTop = 16 * SCALE;
    const footerH = 34 * SCALE;
    const numH = 14 * SCALE;

    let contentH = catBadgeH + catMarginBottom;
    contentH += titleLines.length * titleLineH + titleMarginBottom;
    contentH += metaRows.length * metaRowH + Math.max(0, metaRows.length - 1) * metaGap;
    if (memoLines.length) contentH += memoMarginTop + memoLines.length * memoLineH;
    if (img) contentH += photoMarginTop + photoH;
    contentH += dividerMarginTop + footerMarginTop + footerH + numH;

    const cardH = padTop + contentH + padBottom;
    const H = outerPad + cardH + outerPad;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(W);
    canvas.height = Math.round(H);
    const ctx = canvas.getContext('2d');

    // background
    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, '#EAF6F3');
    bgGrad.addColorStop(1, '#DCEEF8');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // card shadow + fill
    ctx.save();
    ctx.shadowColor = 'rgba(43,76,74,0.22)';
    ctx.shadowBlur = 24 * SCALE;
    ctx.shadowOffsetY = 8 * SCALE;
    roundRectPath(ctx, cardX, outerPad, cardW, cardH, radius);
    ctx.fillStyle = '#FFFDF8';
    ctx.fill();
    ctx.restore();

    ctx.save();
    roundRectPath(ctx, cardX, outerPad, cardW, cardH, radius);
    ctx.clip();

    let cy = outerPad + padTop;
    const cx = cardX + padX;

    // category badge
    measure.font = catFont;
    const catText = entry.category || '';
    const catPadX = 9 * SCALE;
    const catW = measure.measureText(catText).width + catPadX * 2;
    roundRectPath(ctx, cx, cy, catW, catBadgeH, 8 * SCALE);
    ctx.fillStyle = 'rgba(127,216,208,0.22)';
    ctx.fill();
    ctx.font = catFont;
    ctx.fillStyle = '#2B8A7E';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(catText, cx + catPadX, cy + catBadgeH/2 + 1);
    cy += catBadgeH + catMarginBottom;

    // title
    ctx.font = titleFont;
    ctx.fillStyle = '#1B3B39';
    ctx.textBaseline = 'alphabetic';
    titleLines.forEach((line, i)=>{
      ctx.fillText(line, cx, cy + titleLineH*(i+1) - 7*SCALE);
    });
    cy += titleLines.length * titleLineH + titleMarginBottom;

    // meta rows
    ctx.font = metaFont;
    ctx.fillStyle = 'rgba(43,76,74,0.65)';
    metaRows.forEach((text, i)=>{
      const displayText = truncateCanvasText(ctx, text, contentW);
      ctx.fillText(displayText, cx, cy + metaRowH*0.72 + i*(metaRowH+metaGap));
    });
    cy += metaRows.length * metaRowH + Math.max(0, metaRows.length - 1) * metaGap;

    // memo
    if (memoLines.length){
      cy += memoMarginTop;
      ctx.font = memoFont;
      ctx.fillStyle = 'rgba(43,76,74,0.5)';
      memoLines.forEach((line, i)=>{
        ctx.fillText(line, cx, cy + memoLineH*(i+1) - 4*SCALE);
      });
      cy += memoLines.length * memoLineH;
    }

    // photo (properly cropped, never stretched)
    if (img){
      cy += photoMarginTop;
      ctx.save();
      roundRectPath(ctx, cx, cy, contentW, photoH, 10*SCALE);
      ctx.clip();
      drawCover(ctx, img, cx, cy, contentW, photoH);
      ctx.restore();
      cy += photoH;
    }

    cy += dividerMarginTop;

    // dashed divider with punch-hole notches at both edges
    ctx.strokeStyle = 'rgba(43,76,74,0.2)';
    ctx.lineWidth = 2 * SCALE;
    ctx.setLineDash([6*SCALE, 5*SCALE]);
    ctx.beginPath();
    ctx.moveTo(cardX + 14*SCALE, cy);
    ctx.lineTo(cardX + cardW - 14*SCALE, cy);
    ctx.stroke();
    ctx.setLineDash([]);

    const holeR = 8 * SCALE;
    ctx.fillStyle = bgGrad;
    ctx.beginPath(); ctx.arc(cardX, cy, holeR, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cardX + cardW, cy, holeR, 0, Math.PI*2); ctx.fill();

    cy += footerMarginTop;

    // footer: price (left) + barcode (right), both horizontal — no vertical text
    ctx.font = priceFont;
    ctx.fillStyle = '#4A7FBF';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(fmtMoney(entry.price), cx, cy + footerH*0.68);

    const bars = barcodeBars(entry.id);
    const barW = 2 * SCALE, barGap = 1.5 * SCALE;
    const barcodeW = bars.length * (barW + barGap) - barGap;
    const barcodeX = cardX + cardW - padX - barcodeW;
    const barcodeBaseY = cy + footerH;
    ctx.fillStyle = 'rgba(43,76,74,0.4)';
    bars.forEach((h, i)=>{
      const bh = h * SCALE * 0.85;
      ctx.fillRect(barcodeX + i*(barW+barGap), barcodeBaseY - bh, barW, bh);
    });

    cy += footerH;

    // ticket number under barcode
    ctx.font = numFont;
    ctx.fillStyle = 'rgba(43,76,74,0.35)';
    ctx.textAlign = 'right';
    ctx.fillText(ticketNumber(entry.id), cardX + cardW - padX, cy + numH*0.85);

    ctx.restore();
    return canvas;
  }

  function stubHTML(entry, opts){
    opts = opts || {};
    const forShare = opts.forShare;
    const hidePrice = opts.hidePrice;
    const hideActions = opts.hideActions || forShare;
    const bars = barcodeBars(entry.id);
    const barcodeDivs = bars.map(h=>`<div style="height:${h}px"></div>`).join('');
    const photo = entry.photo ? `<img class="stub-photo" src="${escapeAttr(entry.photo)}" alt="" onerror="this.style.display='none'">` : '';
    const mainTitle = entry.eventName || entry.artist;
    const showArtistRow = entry.eventName && entry.artist && entry.artist !== entry.eventName;
    return `
      <div class="stub" data-id="${entry.id}">
        <div class="stub-main">
          <div class="stub-cat">${escapeHtml(entry.category)}</div>
          <div class="stub-title">${escapeHtml(mainTitle)}</div>
          <div class="stub-meta">
            ${showArtistRow ? `<div class="row">🎤 ${escapeHtml(entry.artist)}</div>` : ''}
            <div class="row">📅 ${fmtDateLong(entry.date)}</div>
            ${entry.venue ? `<div class="row">📍 ${escapeHtml(entry.venue)}</div>` : ''}
            ${entry.memo ? `<div class="row" style="margin-top:4px; color:rgba(26,26,26,0.5);">${escapeHtml(entry.memo)}</div>` : ''}
          </div>
          ${photo}
        </div>
        <div class="stub-stub">
          <div class="stub-price">${hidePrice ? '🔒' : fmtMoney(entry.price)}</div>
          <div class="stub-barcode">${barcodeDivs}</div>
          <div class="stub-num">${ticketNumber(entry.id)}</div>
        </div>
      </div>
      ${hideActions ? '' : `
      <div class="stub-actions">
        <button class="btn-share" onclick="window.__stubApp.share('${entry.id}')">공유</button>
        <button class="btn-edit" onclick="window.__stubApp.edit('${entry.id}')">수정</button>
        <button class="btn-del" onclick="window.__stubApp.remove('${entry.id}')">삭제</button>
      </div>`}
    `;
  }

  function escapeHtml(s){
    if (!s) return '';
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // ---------- Calendar ----------
  function renderCalendar(){
    const dowNames = ['일','월','화','수','목','금','토'];
    $('calDow').innerHTML = dowNames.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    $('calTitle').textContent = `${calYear}. ${String(calMonth+1).padStart(2,'0')}`;

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const todayStr = new Date().toISOString().slice(0,10);

    const eventsByDate = {};
    entries.forEach(e=>{
      (eventsByDate[e.date] = eventsByDate[e.date] || []).push(e);
    });

    let html = '';
    for (let i=0;i<firstDay;i++) html += `<div class="cal-cell empty"></div>`;
    for (let d=1; d<=daysInMonth; d++){
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const hasEv = !!eventsByDate[dateStr];
      const isToday = dateStr === todayStr;
      const isSel = dateStr === selectedDate;
      html += `<div class="cal-cell ${hasEv?'has-event':''} ${isToday?'today':''} ${isSel?'selected':''}" data-date="${dateStr}">
        ${d}${hasEv?'<div class="cal-dot"></div>':''}
      </div>`;
    }
    $('calGrid').innerHTML = html;

    document.querySelectorAll('.cal-cell.has-event').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        selectedDate = cell.dataset.date === selectedDate ? null : cell.dataset.date;
        renderCalendar();
        renderDayEvents(eventsByDate);
      });
    });

    renderDayEvents(eventsByDate);
    renderYearStats();
  }

  function renderYearStats(){
    const box = $('yearStats');
    const scopeEntries = statsScope === 'all'
      ? entries
      : entries.filter(e => new Date(e.date + 'T00:00:00').getFullYear() === calYear);

    const toggleHTML = `
      <div class="year-toggle">
        <button data-scope="year" class="${statsScope==='year'?'active':''}">${calYear}년</button>
        <button data-scope="all" class="${statsScope==='all'?'active':''}">전체</button>
      </div>`;
    const titleText = statsScope === 'all' ? '📊 전체 모아보기' : `📊 ${calYear}년 모아보기`;

    if (!scopeEntries.length){
      box.innerHTML = `
        <div class="year-stats-card">
          <div class="year-stats-title" style="justify-content:space-between;">
            <span>${titleText}</span>${toggleHTML}
          </div>
          <div class="year-stats-empty">${statsScope==='all' ? '아직 기록이 없어요' : '이 해에는 아직 기록이 없어요'}</div>
        </div>`;
      bindYearToggle();
      return;
    }

    const count = scopeEntries.length;
    const total = scopeEntries.reduce((s,e)=> s + (Number(e.price)||0), 0);

    // top 5 artists (split comma-separated lineups so each artist counts separately)
    const artistCounts = {};
    scopeEntries.forEach(e=>{
      splitArtists(e.artist).forEach(name=>{
        artistCounts[name] = (artistCounts[name]||0) + 1;
      });
    });
    const topArtists = Object.entries(artistCounts).sort((a,b)=> b[1]-a[1]).slice(0,5);
    const maxArtistCount = topArtists.length ? topArtists[0][1] : 1;

    // category breakdown
    const catCounts = {};
    scopeEntries.forEach(e=>{ catCounts[e.category] = (catCounts[e.category]||0) + 1; });
    const catRows = Object.entries(catCounts).sort((a,b)=> b[1]-a[1]);

    // monthly trend (only meaningful for a single year; for 'all' scope, aggregate by month regardless of year)
    const monthCounts = new Array(12).fill(0);
    scopeEntries.forEach(e=>{
      const m = new Date(e.date + 'T00:00:00').getMonth();
      monthCounts[m]++;
    });
    const maxMonthCount = Math.max(1, ...monthCounts);

    // venues: count + total spend
    const venueStats = {};
    scopeEntries.forEach(e=>{
      const v = e.venue && e.venue.trim() ? e.venue.trim() : '장소 미기록';
      if (!venueStats[v]) venueStats[v] = { count: 0, spend: 0 };
      venueStats[v].count++;
      venueStats[v].spend += Number(e.price) || 0;
    });
    const topVenues = Object.entries(venueStats).sort((a,b)=> b[1].count - a[1].count).slice(0,5);

    box.innerHTML = `
      <div class="year-stats-card">
        <div class="year-stats-title" style="justify-content:space-between;">
          <span>${titleText}</span>${toggleHTML}
        </div>
        <div class="year-stats-grid">
          <div class="ys-item">
            <div class="ys-label">총 관람 횟수</div>
            <div class="ys-value">${count}<small> 회</small></div>
          </div>
          <div class="ys-item">
            <div class="ys-label">총 지출</div>
            <div class="ys-value coral">${fmtMoney(total)}</div>
          </div>
        </div>

        <div class="stats-block">
          <div class="stats-block-title">🎤 자주 만난 아티스트 TOP ${topArtists.length}</div>
          ${topArtists.map(([artist, c], i)=> `
            <div class="top-artist-row">
              <div class="top-artist-rank">${i+1}</div>
              <div class="top-artist-name">${escapeHtml(artist)}</div>
              <div class="top-artist-bar-wrap"><div class="top-artist-bar" style="width:${Math.round(c/maxArtistCount*100)}%"></div></div>
              <div class="top-artist-count">${c}회</div>
            </div>
          `).join('')}
        </div>

        <div class="stats-block">
          <div class="stats-block-title">🎫 공연 취향 (카테고리별)</div>
          <table class="cat-table">
            ${catRows.map(([cat, c])=> `<tr><td>${escapeHtml(cat)}</td><td>${c}회</td></tr>`).join('')}
          </table>
        </div>

        <div class="stats-block">
          <div class="stats-block-title">📈 월별 관람 흐름</div>
          <div class="month-chart">
            ${monthCounts.map((c, i)=> `
              <div class="month-col">
                ${c > 0 ? `<div class="month-count">${c}</div>` : ''}
                <div class="month-bar" style="height:${Math.max(2, Math.round(c/maxMonthCount*60))}px"></div>
                <div class="month-label">${i+1}월</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="stats-block" style="margin-bottom:10px;">
          <div class="stats-block-title">📍 자주 간 공연장</div>
          ${topVenues.map(([venue, v])=> `
            <div class="venue-row">
              <div>
                <div class="venue-name">${escapeHtml(venue)}</div>
                <div class="venue-sub">${v.count}회 방문</div>
              </div>
              <div class="venue-spend">${fmtMoney(v.spend)}</div>
            </div>
          `).join('')}
        </div>
      </div>`;
    bindYearToggle();
  }

  function bindYearToggle(){
    document.querySelectorAll('.year-toggle button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        statsScope = btn.dataset.scope;
        renderYearStats();
      });
    });
  }


  function renderDayEvents(eventsByDate){
    const container = $('dayEvents');
    if (!selectedDate){
      container.innerHTML = '';
      return;
    }
    const evs = eventsByDate ? eventsByDate[selectedDate] : entries.filter(e=>e.date===selectedDate);
    if (!evs || !evs.length){ container.innerHTML=''; return; }
    container.innerHTML = evs.map(e=>`<div class="card-shell">${stubHTML(e)}</div>`).join('');
  }

  // ---------- List ----------
  function renderList(){
    const wrap = $('listWrap');
    if (!entries.length){
      wrap.innerHTML = `<div class="empty-state"><div class="big">🎫</div>첫 공연 기록을 남겨보세요.<br>티켓 스텁처럼 쌓여갈 거예요.</div>`;
      return;
    }
    const total = entries.reduce((s,e)=> s + (Number(e.price)||0), 0);
    let html = `<div class="list-summary"><span>누적 지출</span><b>${fmtMoney(total)}</b></div>`;
    html += entries.map(e=>`<div class="card-shell">${stubHTML(e)}</div>`).join('');
    wrap.innerHTML = html;
  }

  function renderHeaderCount(){
    $('headerCount').textContent = `${entries.length}개의 기록`;
  }

  function renderAll(){
    renderHeaderCount();
    if (currentTab === 'calendar') renderCalendar();
    else if (currentTab === 'list') renderList();
  }

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      $('calendarView').style.display = currentTab==='calendar' ? 'block':'none';
      $('listView').style.display = currentTab==='list' ? 'block':'none';
      renderAll();
    });
  });

  // ---------- Calendar nav ----------
  $('prevMonth').addEventListener('click', ()=>{
    calMonth--; if (calMonth<0){ calMonth=11; calYear--; }
    selectedDate = null;
    renderCalendar();
  });
  $('nextMonth').addEventListener('click', ()=>{
    calMonth++; if (calMonth>11){ calMonth=0; calYear++; }
    selectedDate = null;
    renderCalendar();
  });

  // ---------- Modal ----------
  let selectedCat = '콘서트';
  function openModal(entry){
    editingId = entry ? entry.id : null;
    $('modalTitle').textContent = entry ? '기록 수정' : '새 기록';
    $('fArtist').value = entry ? entry.artist : '';
    $('fEventName').value = entry ? (entry.eventName || '') : '';
    $('fDate').value = entry ? entry.date : (selectedDate || new Date().toISOString().slice(0,10));
    $('fPrice').value = entry ? entry.price : '';
    $('fVenue').value = entry ? entry.venue : '';
    $('fMemo').value = entry ? (entry.memo||'') : '';
    currentPhotoData = entry ? (entry.photo || '') : '';
    $('fPhotoFile').value = '';
    $('photoStatus').textContent = '';
    if (currentPhotoData){
      $('photoPreview').src = currentPhotoData;
      $('photoPreviewWrap').style.display = 'block';
    } else {
      $('photoPreviewWrap').style.display = 'none';
    }
    selectedCat = entry ? entry.category : '콘서트';
    updateCatPicker();
    $('artistSuggest').classList.remove('show');
    $('saveError').textContent = '';
    $('modalBg').classList.add('open');
  }
  function closeModal(){
    $('modalBg').classList.remove('open');
    editingId = null;
  }
  function updateCatPicker(){
    document.querySelectorAll('.cat-chip').forEach(c=>{
      c.classList.toggle('sel', c.dataset.cat === selectedCat);
    });
  }
  document.querySelectorAll('.cat-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ selectedCat = chip.dataset.cat; updateCatPicker(); });
  });

  $('fPhotoFile').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    $('photoStatus').textContent = '사진 처리 중…';
    try {
      // target well under the 5MB per-key storage limit, leaving room for other fields
      const dataUrl = await compressImageToLimit(file, 1500000);
      currentPhotoData = dataUrl;
      $('photoPreview').src = dataUrl;
      $('photoPreviewWrap').style.display = 'block';
      $('photoStatus').textContent = '';
    } catch(err){
      $('photoStatus').textContent = '사진을 불러오지 못했어요';
    }
  });

  $('removePhoto').addEventListener('click', ()=>{
    currentPhotoData = '';
    $('fPhotoFile').value = '';
    $('photoPreviewWrap').style.display = 'none';
  });

  // ---------- Event backlog (shared, searchable event index) ----------
  // Whenever anyone saves an entry, its event info (artist/date/venue/category)
  // gets upserted into a shared backlog so others can find & reuse it instead
  // of typing everything from scratch.
  const BACKLOG_LIST_KEY = 'event_backlog_ids';
  const BACKLOG_KEY_PREFIX = 'event_backlog:';
  let backlog = [];

  function backlogKeyFor(artist, date){
    return (artist.trim().toLowerCase() + '|' + date);
  }

  async function loadBacklog(){
    try {
      const idxRes = await Store.get(BACKLOG_LIST_KEY, true);
      const ids = idxRes ? JSON.parse(idxRes.value) : [];
      const loaded = [];
      for (const id of ids){
        try {
          const r = await Store.get(BACKLOG_KEY_PREFIX + id, true);
          if (r) loaded.push(JSON.parse(r.value));
        } catch(e){ /* skip missing */ }
      }
      backlog = loaded;
    } catch(e){ backlog = []; }
  }

  async function upsertBacklog(entry){
    if (!entry.artist || !entry.date) return;
    const dedupeKey = backlogKeyFor(entry.artist, entry.date);
    let match = backlog.find(b => backlogKeyFor(b.artist, b.date) === dedupeKey);
    if (match){
      match.eventName = entry.eventName || match.eventName;
      match.venue = entry.venue || match.venue;
      match.category = entry.category || match.category;
      match.updatedAt = Date.now();
    } else {
      match = {
        id: 'b_' + Date.now() + '_' + Math.random().toString(36).slice(2,8),
        artist: entry.artist,
        eventName: entry.eventName || '',
        date: entry.date,
        venue: entry.venue || '',
        category: entry.category || '기타',
        updatedAt: Date.now()
      };
      backlog.push(match);
      try {
        const ids = backlog.map(b=>b.id);
        await Store.set(BACKLOG_LIST_KEY, JSON.stringify(ids), true);
      } catch(e){ /* ignore */ }
    }
    try {
      await Store.set(BACKLOG_KEY_PREFIX + match.id, JSON.stringify(match), true);
    } catch(e){ /* ignore, non-critical */ }
  }

  function renderSuggestions(query){
    const box = $('artistSuggest');
    const q = query.trim().toLowerCase();
    if (!q){ box.classList.remove('show'); box.innerHTML=''; return; }
    const matches = backlog
      .filter(b => b.artist.toLowerCase().includes(q))
      .sort((a,b)=> new Date(b.date) - new Date(a.date))
      .slice(0, 6);
    if (!matches.length){ box.classList.remove('show'); box.innerHTML=''; return; }
    box.innerHTML = `<div class="suggest-hint">이전에 등록된 공연</div>` + matches.map(m => `
      <div class="suggest-item" data-id="${m.id}">
        <div class="s-title">${escapeHtml(m.artist)}</div>
        <div class="s-meta">${m.eventName ? escapeHtml(m.eventName) + ' · ' : ''}${fmtDateShort(m.date)}${m.venue ? ' · ' + escapeHtml(m.venue) : ''} · ${escapeHtml(m.category)}</div>
      </div>
    `).join('');
    box.classList.add('show');
    box.querySelectorAll('.suggest-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const m = backlog.find(b=>b.id===item.dataset.id);
        if (!m) return;
        $('fArtist').value = m.artist;
        $('fEventName').value = m.eventName || '';
        $('fDate').value = m.date;
        $('fVenue').value = m.venue || '';
        selectedCat = m.category || '기타';
        updateCatPicker();
        box.classList.remove('show');
      });
    });
  }

  $('fArtist').addEventListener('input', (e)=> renderSuggestions(e.target.value));
  $('fArtist').addEventListener('focus', (e)=> { if (e.target.value.trim()) renderSuggestions(e.target.value); });
  document.addEventListener('click', (e)=>{
    if (!e.target.closest('.field') || !e.target.closest('#artistSuggest') && e.target.id !== 'fArtist'){
      if (e.target.id !== 'fArtist') $('artistSuggest').classList.remove('show');
    }
  });

  $('openAdd').addEventListener('click', ()=> openModal(null));
  $('cancelBtn').addEventListener('click', closeModal);
  $('modalBg').addEventListener('click', (e)=>{ if (e.target===$('modalBg')) closeModal(); });

  $('saveBtn').addEventListener('click', async ()=>{
    const artist = $('fArtist').value.trim();
    const eventName = $('fEventName').value.trim();
    const date = $('fDate').value;
    if (!artist || !date){ toast('아티스트와 날짜는 필수예요'); return; }

    const entry = {
      id: editingId || uid(),
      category: selectedCat,
      artist,
      eventName,
      date,
      price: $('fPrice').value ? Number($('fPrice').value) : 0,
      venue: $('fVenue').value.trim(),
      photo: currentPhotoData,
      memo: $('fMemo').value.trim(),
      createdAt: editingId ? (entries.find(e=>e.id===editingId)?.createdAt || Date.now()) : Date.now()
    };

    $('saveBtn').disabled = true;
    $('saveBtn').textContent = '저장 중…';
    $('saveError').textContent = '';

    async function persist(){
      await saveEntry(entry);
      await saveIndex(entry.id);
      try { await upsertBacklog(entry); } catch(e){ console.error('Backlog upsert failed (non-critical):', e); }
    }

    // Save to persistent storage FIRST. Only touch the in-memory list (and thus the UI)
    // once the save actually succeeds — otherwise an entry can look "saved" and then
    // vanish on refresh because it was never really persisted.
    try {
      try {
        await persist();
      } catch(firstErr){
        console.error('Save failed, retrying once:', firstErr);
        $('saveBtn').textContent = '재시도 중…';
        await new Promise(r => setTimeout(r, 800));
        await persist();
      }

      if (editingId){
        const idx = entries.findIndex(e=>e.id===editingId);
        if (idx>-1) entries[idx] = entry; else entries.push(entry);
      } else {
        entries.push(entry);
      }
      entries.sort((a,b)=> new Date(b.date) - new Date(a.date));

      toast(editingId ? '수정했어요' : '기록했어요 🎫');
      closeModal();
      renderAll();
    } catch(e){
      console.error('Save failed after retry:', e);
      const msg = (e && (e.message || e.toString())) || '알 수 없는 오류';
      $('saveError').textContent = `❌ 저장 실패: ${msg}`;
      toast('저장에 실패했어요');
    } finally {
      $('saveBtn').disabled = false;
      $('saveBtn').textContent = '저장';
    }
  });

  // ---------- Edit / Delete / Share (exposed) ----------
  window.__stubApp = {
    edit: (id)=>{
      const entry = entries.find(e=>e.id===id);
      if (entry) openModal(entry);
    },
    remove: async (id)=>{
      if (!confirm('이 기록을 삭제할까요?')) return;
      entries = entries.filter(e=>e.id!==id);
      try {
        await deleteEntryStorage(id);
        await saveIndex();
        toast('삭제했어요');
      } catch(e){ toast('삭제에 실패했어요'); }
      renderAll();
    },
    share: async (id)=>{
      const entry = entries.find(e=>e.id===id);
      if (!entry) return;
      toast('이미지 생성 중…');
      try {
        const canvas = await buildStubCanvas(entry);
        canvas.toBlob(async (blob)=>{
          if (!blob){ toast('이미지 생성에 실패했어요'); return; }
          const file = new File([blob], `stub_${entry.artist}.png`, { type: 'image/png' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })){
            try {
              await navigator.share({ files: [file], title: entry.artist, text: `${entry.artist} — ${fmtDateShort(entry.date)}` });
              return;
            } catch(e){ /* user cancelled or fallback below */ }
          }
          // fallback: download
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `stub_${entry.artist}.png`;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          URL.revokeObjectURL(url);
          toast('이미지를 저장했어요');
        }, 'image/png');
      } catch(e){
        console.error('Share image build failed:', e);
        toast('공유 이미지 생성에 실패했어요');
      }
    }
  };

  // ---------- Init ----------
  async function init(){
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    await loadEntries();
    await loadBacklog();
    renderAll();
    $('loadingScreen').style.display = 'none';
    $('app').style.display = 'block';
  }

  init();
})();
</script>

</body>
</html>
